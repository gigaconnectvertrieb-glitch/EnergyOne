services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agentur:agentur@db:5432/agentur
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ihre-agentur.de}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentur
      POSTGRES_USER: agentur
      POSTGRES_PASSWORD: agentur
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentur -d agentur"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
  storage:
