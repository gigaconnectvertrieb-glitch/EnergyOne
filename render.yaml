# Render Blueprint: GitHub verbinden, dann "New → Blueprint".
# Region Frankfurt = EU-Hosting.

databases:
  - name: e1-db
    plan: basic-256mb
    postgresMajorVersion: 16
    region: frankfurt

services:
  - type: web
    name: e1-direktvertrieb
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: VITE_GOOGLE_MAPS_KEY
        value: AIzaSyBIlujIrecGRQUpllxMNgcpnaXNyvD4TDU
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: e1-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GOOGLE_WORKSPACE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_WORKSPACE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_CUSTOMER_ID
        sync: false
      - key: DOCUSIGN_INTEGRATION_KEY
        sync: false
      - key: DOCUSIGN_USER_ID
        sync: false
      - key: DOCUSIGN_ACCOUNT_ID
        sync: false
      - key: DOCUSIGN_PRIVATE_KEY
        sync: false
      - key: DOCUSIGN_OAUTH_BASE
        value: https://account-d.docusign.com
      - key: DOCUSIGN_CONNECT_SECRET
        sync: false
    disk:
      name: e1-uploads
      mountPath: /var/data
      sizeGB: 10
